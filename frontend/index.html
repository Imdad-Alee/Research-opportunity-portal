<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-search"></i> Research Opportunity Portal
      </span>
      <button class="btn btn-light btn-sm" onclick="openCreateForm()">
        <i class="bi bi-plus-circle"></i> New Opportunity
      </button>
    </div>
  </nav>

  <div class="container">

    <!-- Alerts -->
    <div id="alertBox"></div>

    <!-- Loading spinner -->
    <div id="loading" class="text-center my-5 d-none">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <!-- Opportunities list -->
    <div id="opportunitiesList" class="row g-3"></div>

    <!-- Empty state -->
    <div id="emptyState" class="text-center text-muted my-5 d-none">
      <i class="bi bi-inbox display-1"></i>
      <p class="mt-3">No opportunities yet. Click "New Opportunity" to add one.</p>
    </div>

  </div>

  <!-- Modal: Create/Edit Form -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">New Opportunity</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="opportunityForm" novalidate>
            <input type="hidden" id="oppId">

            <div class="mb-3">
              <label class="form-label">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="title" required>
              <div class="invalid-feedback">Title is required.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Description <span class="text-danger">*</span></label>
              <textarea class="form-control" id="description" rows="3" required></textarea>
              <div class="invalid-feedback">Description is required.</div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Research Area <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="area" required>
                <div class="invalid-feedback">Area is required.</div>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Skills</label>
                <input type="text" class="form-control" id="skills" placeholder="e.g. Python, ML">
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Positions</label>
                <input type="number" class="form-control" id="positions" min="1" value="1">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Deadline</label>
                <input type="date" class="form-control" id="deadline">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" id="status">
                  <option value="Open">Open</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveOpportunity()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: View Details -->
  <div class="modal fade" id="viewModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Opportunity Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="viewBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
